<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream Manager — LG TV</title>
<!-- How to install Stream Manager on an LG (webOS) TV. A static page on GitHub Pages:
     nothing here talks to the Stream Manager server. Windows PCs get the full
     guide; anything else is told to open it on a Windows PC. ?lang=en English,
     ?as=win previews the PC version.  -->
<style>
  :root{--bg:#0f172a;--card:#1e293b;--line:#334155;--text:#e2e8f0;--dim:#94a3b8;--acc:#818cf8;--warn:#fcd34d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:16px}
  main{max-width:720px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px}
  h1{font-size:1.6rem;margin:.4em 0}
  a{color:var(--acc)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
  .card.hl{background:#312e81aa;border-color:#4f46e5}
  h2{font-size:1.15rem;margin:0 0 .5em}
  ul{margin:0;padding-inline-start:1.3em}
  li{margin:.45em 0}
  code{background:#0b1222;padding:2px 6px;border-radius:6px;direction:ltr;display:inline-block}
  button{background:#475569;color:#fff;border:0;border-radius:6px;padding:2px 10px;font-size:.9em;cursor:pointer;margin-inline-start:6px}
  .dim{color:var(--dim)} .warn{color:var(--warn)} .small{font-size:.9em}
  .big{font-size:1.3rem;font-weight:600;direction:ltr;word-break:break-all}
</style>
</head>
<body>
<main id="app"></main>
<script>
var T = {"he": {"title": "Stream Manager בטלוויזיה של LG", "other": "English", "only": "אפשר להשתמש בדף הזה רק <b>במחשב Windows<\/b>.", "only2": "פתחו את הכתובת הזו במחשב Windows שמחובר לאותה רשת ביתית כמו הטלוויזיה:", "intro": "כ-20 דקות, פעם אחת לכל טלוויזיה. צריך: טלוויזיית LG עם webOS (משנת 2018 ואילך), את המחשב הזה באותה רשת ביתית כמו הטלוויזיה, וחשבון מפתחים חינמי של LG.", "steps": [["1. פתיחת חשבון מפתחים חינמי ב-LG", ["במחשב היכנסו ל-<a href=\"https://webostv.developer.lge.com/\">webostv.developer.lge.com<\/a> ← <b>Sign In<\/b> ← פתחו חשבון (בחינם). זכרו את האימייל והסיסמה — הטלוויזיה תבקש אותם בשלב 2."]], ["2. הפעלת מצב מפתחים בטלוויזיה", ["בטלוויזיה פתחו את <b>LG Content Store<\/b> (חנות האפליקציות), חפשו <b>Developer Mode<\/b> והתקינו.", "פתחו את <b>Developer Mode<\/b> והתחברו עם החשבון משלב 1.", "העבירו את <b>Dev Mode Status<\/b> ל-ON. הטלוויזיה תופעל מחדש.", "פתחו שוב את <b>Developer Mode<\/b> והעבירו את <b>Key Server<\/b> ל-ON. השאירו את המסך פתוח: מופיעים בו <b>כתובת ה-IP<\/b> של הטלוויזיה ו<b>סיסמה (Passphrase)<\/b> — צריך את שניהם בשלב 3."]], ["3. חיבור המחשב לטלוויזיה", ["הורידו והתקינו את <a href=\"https://github.com/webosbrew/dev-manager-desktop/releases/download/v1.99.20/webOS.Dev.Manager_1.99.20_x64_en-US.msi\">webOS Dev Manager ל-Windows<\/a>.", "פתחו אותו ובחרו <b>Add device<\/b>: הזינו את ה-IP של הטלוויזיה ואת ה-Passphrase ממסך Developer Mode. התוכנה מתחברת לטלוויזיה."]], ["4. שמירה על מצב המפתחים (חשוב)", ["LG מכבה את מצב המפתחים אחרי 50 שעות — ואז <b>מוחקת את האפליקציות שהותקנו דרכו<\/b>, כך שיהיה צריך להתקין את Stream Manager מחדש.", "כדי למנוע את זה, כל יום-יומיים פתחו בטלוויזיה את האפליקציה <b>Developer Mode<\/b> ולחצו <b>Extend<\/b> (לוקח שניות ומאפס את השעון ל-50 שעות)."]], ["5. התקנת Stream Manager", ["הורידו את <a href=\"https://github.com/magicaltoothferry/stream-manager/releases/latest/download/StreamManager.ipk\">StreamManager.ipk<\/a> למחשב.", "ב-webOS Dev Manager פתחו <b>Apps<\/b> ← <b>Install<\/b> ובחרו את הקובץ StreamManager.ipk שהורדתם. אחרי כמה שניות הוא מופיע באפליקציות של הטלוויזיה."]], ["6. פתיחה וכניסה", ["בטלוויזיה פתחו את <b>Stream Manager<\/b>. יופיע קוד QR: סרקו אותו במצלמת הטלפון ואשרו בטלגרם — הטלוויזיה תתחבר לבד.", "אם לחשבון עדיין לא מחובר TorBox, הטלוויזיה תציג איך לחבר אותו."]]], "remote": "בשלט בזמן צפייה: OK = השהיה · ◀ ▶ = אחורה 10 שנ׳ / קדימה 30 שנ׳ · ▲ = כתוביות (החלפה, תרגום לעברית, תזמון) · BACK = עצירה. בשידור חי: ▲ ▼ או CH+ CH− מחליפים ערוץ. כפתור היציאה למעלה סוגר את האפליקציה.", "trouble": "אם Stream Manager נעלם מהטלוויזיה — מצב המפתחים פג: הפעילו אותו שוב (שלב 2) והתקינו מחדש (שלב 5). אם webOS Dev Manager לא מתחבר — ודאו ש-Key Server במצב ON ושה-Passphrase נכון."}, "en": {"title": "Stream Manager on an LG TV", "other": "עברית", "only": "This page can be used only on a <b>Windows PC<\/b>.", "only2": "Open this address on a Windows computer that is on the same home network as the TV:", "intro": "About 20 minutes, once per TV. You need: an LG TV with webOS (2018 or later), this PC on the same home network as the TV, and a free LG developer account.", "steps": [["1. Create a free LG developer account", ["On this PC go to <a href=\"https://webostv.developer.lge.com/\">webostv.developer.lge.com<\/a> → <b>Sign In<\/b> → create an account (free). Remember the email and password — the TV asks for them in step 2."]], ["2. Turn on Developer Mode on the TV", ["On the TV open the <b>LG Content Store<\/b> (Apps), search <b>Developer Mode<\/b> and install it.", "Open <b>Developer Mode<\/b> and sign in with the account from step 1.", "Switch <b>Dev Mode Status<\/b> ON. The TV restarts.", "Open <b>Developer Mode<\/b> again and switch <b>Key Server<\/b> ON. Leave this screen open: it shows the TV’s <b>IP address<\/b> and a <b>passphrase<\/b> — you need both in step 3."]], ["3. Connect this PC to the TV", ["Download and install <a href=\"https://github.com/webosbrew/dev-manager-desktop/releases/download/v1.99.20/webOS.Dev.Manager_1.99.20_x64_en-US.msi\">webOS Dev Manager for Windows<\/a>.", "Open it and choose <b>Add device<\/b>: enter the TV’s IP and the passphrase from the TV’s Developer Mode screen. It connects to the TV."]], ["4. Keep Developer Mode alive (important)", ["LG switches Developer Mode off after 50 hours — and then <b>removes the apps installed through it<\/b>, so Stream Manager would need installing again.", "To prevent that, every day or two open the <b>Developer Mode<\/b> app on the TV and press <b>Extend<\/b> (it takes seconds and resets the timer to 50 hours)."]], ["5. Install Stream Manager", ["Download <a href=\"https://github.com/magicaltoothferry/stream-manager/releases/latest/download/StreamManager.ipk\">StreamManager.ipk<\/a> to this PC.", "In webOS Dev Manager open <b>Apps<\/b> → <b>Install<\/b> and choose the downloaded StreamManager.ipk. After a few seconds it appears in the TV’s apps."]], ["6. Open and sign in", ["On the TV open <b>Stream Manager<\/b>. It shows a QR code: scan it with your phone’s camera and confirm in Telegram — the TV signs in by itself.", "If your account has no TorBox linked yet, the TV shows how to link it."]]], "remote": "On the remote while watching: OK = pause · ◀ ▶ = back 10s / forward 30s · ▲ = subtitles (switch, translate to Hebrew, timing) · BACK = stop. Live TV: ▲ ▼ or CH+ CH− change channel. The Exit button at the top closes the app.", "trouble": "If Stream Manager disappeared from the TV, Developer Mode expired: turn it on again (step 2) and reinstall (step 5). If webOS Dev Manager cannot connect, check that Key Server is ON and the passphrase matches."}};
var PAGE = 'magicaltoothferry.github.io/stream-manager/lg.html';
var MOD = 'magicaltoothferry/stream-manager';
var q = new URLSearchParams(location.search);
var lang = q.get('lang') === 'en' ? 'en' : 'he';
var L = T[lang];
var ua = navigator.userAgent;
var isPc = /Windows NT/i.test(ua) && !/Windows Phone|Xbox/i.test(ua) && !((navigator.maxTouchPoints || 0) > 1 && Math.min(screen.width, screen.height) < 700);
if (q.get('as') === 'win') isPc = true;
document.documentElement.lang = lang;
document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var other = new URLSearchParams(location.search); if (lang === 'en') other.delete('lang'); else other.set('lang', 'en');
var h = '<header><h1>📺 ' + esc(L.title) + '</h1><a href="?' + other.toString() + '">' + L.other + '</a></header>';
if (!isPc) {
  h += '<div class="card hl"><p>💻 ' + L.only + '</p><p class="dim">' + esc(L.only2) + '</p><p class="big">' + PAGE + '</p></div>';
} else {
  h += '<p class="dim">' + L.intro + '</p>';
  L.steps.forEach(function (st) {
    h += '<div class="card"><h2>' + st[0] + '</h2><ul>' + st[1].map(function (li) {
      return '<li>' + li.replace('%COPY%', '<button data-copy="' + MOD + '">' + esc(L.copy) + '</button>') + '</li>';
    }).join('') + '</ul></div>';
  });
  h += '<p class="small">' + L.remote + '</p><p class="small warn">' + L.trouble + '</p>';
}
document.getElementById('app').innerHTML = h;
document.title = L.title;
document.querySelectorAll('[data-copy]').forEach(function (b) {
  b.onclick = function () {
    var t = b.getAttribute('data-copy'), done = function () { b.textContent = L.copied; };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, function () {});
  };
});
</script>
</body>
</html>
